
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🐍 Snake Game</h1>

        <div class="score-board">
            <span>Score: <span id="score">0</span></span>
            <span>Best: <span id="highScore">0</span></span>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <p id="message">Press Start to play!</p>

        <div class="buttons">
            <button id="startBtn">Start Game</button>
            <button id="pauseBtn">Pause</button>
        </div>

        <div class="controls">
            <button data-dir="up">⬆️</button>
            <div>
                <button data-dir="left">⬅️</button>
                <button data-dir="down">⬇️</button>
                <button data-dir="right">➡️</button>
            </div>
        </div>

        <p class="help">Use arrow keys or WASD to move.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
